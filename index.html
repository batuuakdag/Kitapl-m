<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183c2d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kitaplığım</title>
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#183c2d;--muted:#718076;--line:#ded8ca;--accent:#b58b55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px 32px}
header{padding:24px 2px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:#e9dfcc;display:grid;place-items:center;font-size:24px;box-shadow:0 5px 16px #183c2d14}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);margin-top:2px}
.icon{width:42px;height:42px;border-radius:13px;background:var(--card);color:var(--ink);font-size:19px;box-shadow:0 4px 15px #183c2d0c}
.hero{background:var(--ink);color:#fffdf8;border-radius:26px;padding:24px;margin:10px 0 22px;box-shadow:0 12px 30px #183c2d25}.hero p{color:#d8e1db;margin:6px 0 18px}.continue{display:flex;gap:16px;align-items:center}.cover{width:72px;height:96px;border-radius:8px;background:linear-gradient(145deg,#d5bd91,#9a7749);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:8px;flex:none}.progress{height:7px;background:#ffffff26;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#d7b77c;border-radius:99px}.hero button{background:#f5e7ca;color:var(--ink);padding:11px 15px;border-radius:12px;font-weight:700}
.search{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);padding:11px 14px;border-radius:15px;margin-bottom:14px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#e9e4d9;color:var(--ink)}.chip.active{background:var(--ink);color:#fff}
.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section h2{font-size:19px;margin:0}.section span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px;box-shadow:0 5px 18px #183c2d08}.bookcover{height:170px;border-radius:12px;display:flex;align-items:flex-end;padding:13px;color:#fff;font-weight:700;line-height:1.15;background:linear-gradient(145deg,#315b47,#172f25)}.book:nth-child(3n) .bookcover{background:linear-gradient(145deg,#876c47,#443421)}.book:nth-child(4n) .bookcover{background:linear-gradient(145deg,#536b67,#263d39)}.book h3{font-size:15px;margin:10px 2px 3px}.book p{font-size:12px;color:var(--muted);margin:0 2px 9px}.book .read{width:100%;padding:9px;border-radius:11px;background:#edf0e8;color:var(--ink);font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#10251dcc;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.open{display:flex}.reader{width:min(760px,100%);height:94vh;background:var(--card);border-radius:25px 25px 0 0;padding:16px 20px env(safe-area-inset-bottom);display:flex;flex-direction:column}.readerbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.readerbar button{background:#eee9df;color:var(--ink);border-radius:11px;padding:9px 11px}.readerinfo{text-align:center;flex:1}.readerinfo b{font-size:14px}.readerinfo small{display:block;color:var(--muted);margin-top:2px}.tools{display:flex;gap:7px;overflow:auto;padding:12px 0}.tools button{background:#eee9df;border-radius:10px;padding:8px 11px;color:var(--ink);white-space:nowrap}.lightpanel{display:none;gap:10px;align-items:center;background:#eee9df;border-radius:12px;padding:9px 11px;margin:0 0 8px;color:var(--ink)}.lightpanel.open{display:flex}.lightpanel input{flex:1;accent-color:#183c2d}.lightpanel span{min-width:42px;text-align:right;font-size:12px}.reader{position:relative}.light-overlay{position:absolute;left:0;right:0;top:112px;bottom:60px;background:rgba(0,0,0,0);pointer-events:none;z-index:2;border-radius:0 0 20px 20px}.page{flex:1;overflow:auto;padding:18px 8px 44px;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.82;color:#332f29;letter-spacing:.005em;max-width:720px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}.page h1{font-family:inherit;line-height:1.2;color:var(--ink);font-size:1.65em;margin:0 0 1.1em}.page p{margin:0 0 1.05em}.page > div,.page section{max-width:680px;margin:auto}.readerfoot{border-top:1px solid var(--line);padding-top:10px}.bar{height:5px;background:#ddd7ca;border-radius:99px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.footline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
body.dark{--bg:#101814;--card:#17221c;--ink:#e8efe9;--muted:#aab8ae;--line:#2d3a32}.dark .search,.dark .book{box-shadow:none}.dark .book .read,.dark .tools button,.dark .readerbar button,.dark .chip{background:#243128;color:var(--ink)}.dark .page{color:#ddd8cf}.dark .hero{background:#20382b}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">📖</div><div><b>Kitaplığım</b><small>Kendi dijital kütüphanen</small></div></div><button class="icon" id="theme">☾</button></header>
<section class="hero">
<div><small>OKUMAYA DEVAM ET</small><h2 id="continueTitle" style="margin:5px 0">Henüz kitap yok</h2><p id="continueText">Bir kitap seçerek okumaya başla.</p><small id="offlineStatus" style="color:#d8e1db">● Çevrimdışı okuma hazır</small></div>
<div class="continue"><div class="cover" id="continueCover">📚</div><div style="flex:1"><div class="progress"><i id="heroProgress" style="width:0%"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#d8e1db;margin:7px 0 10px"><span id="progressText">%0</span><span id="minutes">0 dk</span></div><button id="continueBtn" style="display:none">Kaldığın Yerden Oku</button></div></div>
</section>
<div class="search">🔎 <input id="search" placeholder="Kitap veya yazar ara..."></div>
<div class="chips" id="chips"></div>
<div class="section"><h2>Kitaplık</h2><span id="count"></span></div>
<div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
<div class="reader">
<div class="readerbar"><button id="close">✕</button><div class="readerinfo"><b id="readerTitle"></b><small id="readerAuthor"></small></div><button id="fav">♡</button></div>
<div class="tools"><button id="downloadBook">⬇️ Çevrimdışı Kaydet</button><button id="minus">A−</button><button id="plus">A+</button><button id="sepia">Sepya</button><button id="darkreader">Gece</button><button id="bookmark">🔖 Yer imi</button><button id="lightBtn">☀️ Işık</button></div><div class="lightpanel" id="lightPanel"><span>🌙</span><input id="lightRange" type="range" min="35" max="100" step="5" value="100"><span id="lightValue">%100</span></div><article class="page" id="page"></article><div class="light-overlay" id="lightOverlay"></div>
<div class="readerfoot"><div class="bar"><i id="readerProgress"></i></div><div class="footline"><span id="pageLabel">Bölüm 1</span><span id="readerPercent">%0</span></div></div>
</div></div>

<script>
const books=[
["Aşk-ı Memnu","Halid Ziya Uşaklıgil","Türk Edebiyatı"],["Kürk Mantolu Madonna","Sabahattin Ali","Türk Edebiyatı"],["Eylül","Mehmet Rauf","Türk Edebiyatı"],["Araba Sevdası","Recaizade Mahmut Ekrem","Türk Edebiyatı"],["Kaşağı","Ömer Seyfettin","Öykü"],["Suç ve Ceza","Fyodor Dostoyevski","Klasik"],["Yeraltından Notlar","Fyodor Dostoyevski","Klasik"],["Anna Karenina","Lev Tolstoy","Klasik"],["İvan İlyiç'in Ölümü","Lev Tolstoy","Klasik"],["Gurur ve Önyargı","Jane Austen","Klasik"],["Jane Eyre","Charlotte Brontë","Klasik"],["Dracula","Bram Stoker","Korku"],["Frankenstein","Mary Shelley","Korku"],["Dorian Gray'in Portresi","Oscar Wilde","Klasik"],["1984","George Orwell","Bilim Kurgu"],["Hayvan Çiftliği","George Orwell","Klasik"],["Zaman Makinesi","H. G. Wells","Bilim Kurgu"],["Dünyalar Savaşı","H. G. Wells","Bilim Kurgu"],["Sherlock Holmes: Kızıl Dosya","Arthur Conan Doyle","Polisiye"],["Define Adası","R. L. Stevenson","Macera"],["Robinson Crusoe","Daniel Defoe","Macera"],["Monte Cristo Kontu","Alexandre Dumas","Macera"],["Üç Silahşörler","Alexandre Dumas","Macera"],["Sefiller","Victor Hugo","Klasik"],["Notre Dame'ın Kamburu","Victor Hugo","Klasik"],["Oliver Twist","Charles Dickens","Klasik"],["İki Şehrin Hikâyesi","Charles Dickens","Klasik"],["Beyaz Diş","Jack London","Macera"],["Vahşetin Çağrısı","Jack London","Macera"],["Martin Eden","Jack London","Klasik"],["Fareler ve İnsanlar","John Steinbeck","Klasik"],["Moby Dick","Herman Melville","Macera"],["Alice Harikalar Diyarında","Lewis Carroll","Çocuk"],["Gulliver'in Gezileri","Jonathan Swift","Macera"],["Don Kişot","Miguel de Cervantes","Klasik"],["Muhteşem Gatsby","F. Scott Fitzgerald","Klasik"],["Bilinmeyen Bir Kadının Mektubu","Stefan Zweig","Öykü"],["Satranç","Stefan Zweig","Öykü"],["Karamazov Kardeşler","Fyodor Dostoyevski","Klasik"]
];
const cats=["Tümü",...new Set(books.map(x=>x[2]))];
let state=JSON.parse(localStorage.getItem("kitapligim_v6")||"{}"), selected=null, font=Number(localStorage.getItem("readerFont")||19);
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("kitapligim_v6",JSON.stringify(state))}
function render(){
 let q=$("search").value.toLocaleLowerCase("tr-TR"), cat=state.cat||"Tümü";
 let list=books.filter(b=>(cat==="Tümü"||b[2]===cat)&&(!q||b[0].toLocaleLowerCase("tr-TR").includes(q)||b[1].toLocaleLowerCase("tr-TR").includes(q)));
 $("count").textContent=list.length+" kitap";
 $("grid").innerHTML=list.map((b,i)=>`<div class="book"><div class="bookcover">${b[0]}</div><h3>${b[0]}</h3><p>${b[1]}</p><button class="read" onclick="openBook(${books.indexOf(b)})">Oku</button></div>`).join("")||'<div class="empty">Aradığın kitap bulunamadı.</div>';
 $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"active":""}" onclick="state.cat='${c}';save();render()">${c}</button>`).join("");
 let cont=state.last;if(cont!=null){let b=books[cont],p=state.progress?.[cont]||0;$("continueTitle").textContent=b[0];$("continueText").textContent=b[1];$("continueCover").textContent=b[0];$("heroProgress").style.width=p+"%";$("progressText").textContent="%"+p;$("minutes").textContent=(state.minutes?.[cont]||0)+" dk";$("continueBtn").style.display="inline-block";$("continueBtn").onclick=()=>openBook(cont)}else{$("continueBtn").style.display="none"}
}

const DB_NAME="KitapligimOfflineDB",DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveOfflineBook(id,html){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction("books","readwrite");t.objectStore("books").put({id,html,savedAt:Date.now()});t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function getOfflineBook(id){try{const db=await openDB();return await new Promise((resolve,reject)=>{const t=db.transaction("books","readonly");const r=t.objectStore("books").get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}

function openBook(i){selected=i;state.last=i;state.progress??={};state.progress[i]??=0;state.minutes??={};state.minutes[i]??=0;save();let b=books[i];$("readerTitle").textContent=b[0];$("readerAuthor").textContent=b[1];$("fav").textContent=(state.fav?.includes(i)?"♥":"♡");$("modal").classList.add("open");renderReader();render()}
async function fetchBookFromWikisource(){
 const api='https://tr.wikisource.org/w/api.php?action=parse&page='+encodeURIComponent('Aşk-ı Memnu/Bölüm 1')+'&prop=text&format=json&formatversion=2&origin=*';
 const r=await fetch(api,{cache:'no-store'});
 if(!r.ok) throw new Error('Kaynak alınamadı');
 const j=await r.json();
 let raw=j?.parse?.text;
 if(!raw) throw new Error('Metin bulunamadı');
 const doc=new DOMParser().parseFromString(raw,'text/html');
 const root=doc.querySelector('.mw-parser-output')||doc.body;
 root.querySelectorAll('script,style,table,.mw-editsection,.reference,.reflist,.navbox,.metadata,.toc').forEach(x=>x.remove());
 root.querySelectorAll('a').forEach(a=>a.removeAttribute('href'));
 const out=document.createElement('div');
 Array.from(root.children).forEach(el=>{
   const t=el.textContent.trim();
   if(t) out.appendChild(el.cloneNode(true));
 });
 return out.innerHTML;
}

async function loadBookHtml(id){
 const saved=await getOfflineBook(id);
 if(saved) return {html:saved.html,offline:true};
 if(books[id][0]!=="Aşk-ı Memnu") return {html:null,offline:false};
 try{
   const html=await fetchBookFromWikisource();
   await saveOfflineBook(id,html);
   return {html,offline:true};
 }catch(e){
   return {html:null,offline:false,error:e};
 }
}

async function renderReader(){
 let b=books[selected],p=state.progress[selected]||0;
 $("page").style.fontSize=font+"px";
 $("readerTitle").textContent=b[0]; $("readerAuthor").textContent=b[1];
 const result=await loadBookHtml(selected);
 if(result.html){
   $("page").innerHTML=result.html;
   $("offlineStatus").textContent="● Aşk-ı Memnu Bölüm 1 cihazına kaydedildi — internetsiz okuyabilirsin";
   $("downloadBook").textContent="✓ Çevrimdışı Kayıtlı";
 }else{
   $("page").innerHTML=`<h1>${b[0]}</h1><p><em>${b[1]}</em></p><p>Kitabın gerçek metni şu anda internetten alınamadı.</p><p><a href="https://tr.wikisource.org/wiki/A%C5%9Fk-%C4%B1_Memnu/B%C3%B6l%C3%BCm_1" target="_blank" rel="noopener">📖 Vikikaynak'ta Bölüm 1'i aç</a></p><p>İnternet bağlantısı geldiğinde “Oku” ekranını yeniden aç; metin otomatik olarak cihazına kaydedilecek.</p>`;
   $("offlineStatus").textContent="● Kaynak bağlantısı bekleniyor";
   $("downloadBook").textContent="⬇️ Çevrimdışı Kaydet";
 }
 $("readerProgress").style.width=p+"%";
 $("readerPercent").textContent="%"+p;
 $("pageLabel").textContent="Bölüm 1";
 applyLight();
}

$("downloadBook").onclick=async()=>{
 if(selected==null)return;
 const existing=await getOfflineBook(selected);
 if(existing){alert("Bu kitap zaten cihazına kaydedilmiş. İnternet olmadan da okuyabilirsin. 📖");return;}
 try{
   const real=await fetchBookFromWikisource();
   await saveOfflineBook(selected,real);
   $("page").innerHTML=real;
   $("downloadBook").textContent="✓ Çevrimdışı Kayıtlı";
   $("offlineStatus").textContent="● Aşk-ı Memnu cihazına kaydedildi — internetsiz okuyabilirsin";
   alert("Aşk-ı Memnu Bölüm 1 cihazına kaydedildi. Artık internet olmadan da okuyabilirsin. 📚");
 }catch(e){
   alert("Metin şu anda alınamadı. İnternet bağlantını kontrol edip tekrar dene.");
 }
};

function applyLight(){
 const v=Number(localStorage.getItem("readingLight")||100);
 $("lightRange").value=v; $("lightValue").textContent="%"+v;
 $("lightOverlay").style.background=`rgba(0,0,0,${(100-v)/100*0.72})`;
}
$("lightBtn").onclick=()=>{$("lightPanel").classList.toggle("open");applyLight()};
$("lightRange").oninput=()=>{localStorage.setItem("readingLight",$("lightRange").value);applyLight()};

$("close").onclick=()=>$("modal").classList.remove("open");
$("plus").onclick=()=>{font=Math.min(30,font+2);localStorage.setItem("readerFont",font);renderReader()};
$("minus").onclick=()=>{font=Math.max(14,font-2);localStorage.setItem("readerFont",font);renderReader()};
$("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark"))};
$("darkreader").onclick=()=>{$("page").style.background=document.body.classList.contains("dark")?"#17221c":"#fffdf8";$("page").style.color=document.body.classList.contains("dark")?"#ddd8cf":"#332f29"};
$("sepia").onclick=()=>{$("page").style.background="#f1e4c9";$("page").style.color="#403529"};
$("fav").onclick=()=>{state.fav??=[];if(state.fav.includes(selected))state.fav=state.fav.filter(x=>x!==selected);else state.fav.push(selected);save();$("fav").textContent=state.fav.includes(selected)?"♥":"♡"};
$("bookmark").onclick=()=>{state.bookmark=selected;save();alert("Yer imi kaydedildi ❤️")};
$("page").onscroll=()=>{let el=$("page"),p=Math.round(el.scrollTop/(el.scrollHeight-el.clientHeight)*100)||0;state.progress[selected]=Math.max(state.progress[selected]||0,p);state.minutes[selected]=(state.minutes[selected]||0)+0.01;save();$("readerProgress").style.width=p+"%";$("readerPercent").textContent="%"+p;render()};
$("search").oninput=render;
if(localStorage.getItem("dark")==="true")document.body.classList.add("dark");
render();
</script>
</body></html>
